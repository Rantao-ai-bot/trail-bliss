<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/style.css">

<body>
    <header class="header">
      <div class="container header-container">
        <ul class="header-list">
            <li class="header-item"><a href="#" class="header-link">Home</a></li>
            <li class="header-item"><a href="#" class="header-link">Pricing</a></li>
            <li class="header-item"><a href="#" class="header-link">Blog</a></li>
        </ul>
        <a class="header-logo" href="./index.html"><svg class="header-leaf">
            <use href="./imgs/symbol-defs.svg#logo"></use>
        </svg>Trail Bliss</a>
        <button class="header-btn">
            <svg class="header-menu">
                <use href="./imgs/symbol-defs.svg#menu"></use>
            </svg>
        </button>
        <ul class="header-items">
            <li class="header-elem"><a href="#" class="header-contakt">Testimonial</a></li>

    <main>
        <section class="hero">
  <div class="container">
    <div class="hero-wrap">
      <h1 class="hero-title">
        Discover Your Next Great Adventure with Trail Bliss
      </h1>

      <div class="hero-content">
        <p class="hero-text">
          Uncover hidden gems, plan seamless trips, and make memories that last a lifetime. Your journey to bliss begins here.
        </p>

        <button class="hero-btn" type="button">
          Start Exploring
          <svg class="hero-arow">
            <use href="./imgs/symbol-defs.svg#arow-3"></use>
          </svg>
        </button>
      </div>
    </div>

    <picture>
      <source
        srcset="./desktop/hero-destop@1x.jpg 1x, ./desktop/hero-destop@2x.jpg 2x"
        media="(min-width: 1264px)"
      >
      <source
        srcset="./mobile/hero-mobile@1x.jpg 1x, ./mobile/hero-mobile@2x.jpg 2x"
        media="(min-width: 382px)"
      >
      <img class="hero-img" src="./imgs/hero-img.webp" alt="Venice canal">
    </picture>
  </div>
</section>
    </main>
    <footer></footer>
